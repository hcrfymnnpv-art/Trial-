<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ocean Captain 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071827;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:5;color:#fff;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}
.panel{background:#0008;border:1px solid #fff3;border-radius:12px;padding:9px 12px;backdrop-filter:blur(6px)}
#controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
button{width:66px;height:66px;border:1px solid #fff5;border-radius:50%;background:#101c28dd;color:white;font-size:25px;font-weight:700;box-shadow:0 5px 18px #0008}
button:active{transform:scale(.94);background:#31546c}
.wide{width:82px;border-radius:20px;font-size:16px}
#message{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:7;color:#fff;background:#06111de8;padding:14px 18px;border-radius:14px;border:1px solid #fff3;display:none;text-align:center;max-width:80%}
</style>
</head>
<body>
<div id="hud">
  <div class="panel"><b>OCEAN CAPTAIN</b><br>Speed: <span id="speed">0.0</span> kn<br>Fuel: <span id="fuel">100</span>%</div>
  <div class="panel">💰 £<span id="cash">0</span><br>📦 <span id="cargo">No cargo</span></div>
</div>
<div id="message"></div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button><button id="right">▶</button>
  </div>
  <div class="group">
    <button id="brake" class="wide">REVERSE</button><button id="throttle" class="wide">THROTTLE</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fb8cf);
scene.fog=new THREE.Fog(0x8fb8cf,180,700);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff,0x27465a,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-120,180,80); sun.castShadow=true; scene.add(sun);

const ocean=new THREE.Mesh(
 new THREE.PlaneGeometry(1400,1400,100,100),
 new THREE.MeshStandardMaterial({color:0x16739a,roughness:.75,metalness:.05})
);
ocean.rotation.x=-Math.PI/2; ocean.position.y=-1; scene.add(ocean);

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.65}));
 m.position.set(x,y,z); m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(r,h,color,x,y,z){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),new THREE.MeshStandardMaterial({color}));
 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}

// Port
box(260,2,42,0x777c80,0,0,-115);
for(let x=-105;x<=105;x+=30){ box(20,4,12,0x3f464b,x,3,-116); box(20,5,12,0xc94b35,x,7,-116); }
for(let x=-90;x<=90;x+=45){
  box(3,42,3,0x5a4b3f,x,21,-110);
  box(26,3,3,0x5a4b3f,x+11,40,-110);
  box(2,2,30,0x5a4b3f,x+23,25,-110);
}
const lightHouse=cyl(5,32,0xe9e1ce,105,16,-112); cyl(6,3,0xd44b3f,105,33,-112);

// Buildings
for(let i=0;i<10;i++){
 let x=-145+i*30; let h=10+Math.random()*25;
 box(18,h,20,0x777b80,x,h/2,-155);
}

// Ship
const ship=new THREE.Group(); scene.add(ship);
box(16,3,65,0xbcc4c8,0,1,0).parent.remove; // unused global object
// build locally so ship moves as group
function sbox(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));m.position.set(x,y,z);m.castShadow=true;ship.add(m);return m;}
sbox(15,3,58,0xd7d9d8,0,1,0);
sbox(12,5,8,0xb52e2e,0,4,-20);
sbox(11,4,9,0xe8e7df,0,7,-19);
sbox(5,2,8,0xf0f0ec,0,10,-19);
sbox(14,2,24,0xc93632,0,3,13);
const bridge=sbox(10,8,10,0xf0eee8,0,8,18);
for(let x=-4;x<=4;x+=2){let w=sbox(1.3,1.3,1,0x183747,x,9,12.8);}
for(let i=-1;i<=1;i++){sbox(4,2,7,0xe65a32,i*4,5,-5);}
const mast=sbox(1,15,1,0x555c61,0,17,18);
sbox(.5,1,.5,0xffd45c,0,24,18);
ship.position.set(0,0,-45);

// Cargo crane on ship
for(let x of [-5,5]){sbox(1,9,1,0xf0b83a,x,12,4);sbox(12,1,1,0xf0b83a,0,16,4);}
sbox(1,8,1,0xf0b83a,0,12,4);

// Other ships
function otherShip(x,z,scale){
 const g=new THREE.Group(); scene.add(g);
 const a=new THREE.Mesh(new THREE.BoxGeometry(10,2.5,34),new THREE.MeshStandardMaterial({color:0xdddddd}));a.position.y=1;g.add(a);
 const b=new THREE.Mesh(new THREE.BoxGeometry(7,6,7),new THREE.MeshStandardMaterial({color:0xe2e2dc}));b.position.set(0,5,9);g.add(b);
 g.position.set(x,0,z);g.scale.setScalar(scale); return g;
}
const traffic=[otherShip(-75,-10,1),otherShip(95,55,1.25),otherShip(-130,90,.8)];

// Mission marker
const marker=new THREE.Mesh(new THREE.RingGeometry(8,10,32),new THREE.MeshBasicMaterial({color:0xffd23f,side:THREE.DoubleSide}));
marker.rotation.x=-Math.PI/2;marker.position.set(0,.2,-95);scene.add(marker);

let speed=0,heading=0,fuel=100,cash=0,delivered=false,throttleHeld=false;
const keys={left:false,right:false,throttle:false,brake:false};
function bind(id,key){const b=document.getElementById(id);
 ['touchstart','mousedown'].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();keys[key]=true}));
 ['touchend','touchcancel','mouseup','mouseleave'].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();keys[key]=false}));
}
bind('left','left');bind('right','right');bind('throttle','throttle');bind('brake','brake');

addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp')keys.throttle=true;if(e.key==='ArrowDown')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='ArrowUp')keys.throttle=false;if(e.key==='ArrowDown')keys.brake=false});

function msg(t){const m=document.getElementById('message');m.innerHTML=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',3500);}
msg('Sail to the yellow ring at the port and deliver your cargo.');

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;
 if(keys.throttle){speed=Math.min(speed+3*dt,22);fuel=Math.max(0,fuel-.12*dt);}
 else if(keys.brake){speed=Math.max(speed-4*dt,-5);}
 else {speed*=Math.pow(.985,dt*60);}
 if(Math.abs(speed)>0.15){
   if(keys.left)heading+=.45*dt*(Math.abs(speed)/10);
   if(keys.right)heading-=.45*dt*(Math.abs(speed)/10);
   ship.position.x+=Math.sin(heading)*speed*dt*1.25;
   ship.position.z+=Math.cos(heading)*speed*dt*1.25;
 }
 ship.rotation.y=heading;
 ocean.position.x=ship.position.x; ocean.position.z=ship.position.z;
 marker.rotation.z+=dt;
 if(!delivered && Math.hypot(ship.position.x-marker.position.x,ship.position.z-marker.position.z)<16 && Math.abs(speed)<2){
   delivered=true;cash+=12500;document.getElementById('cargo').textContent='Delivered ✓';msg('Cargo delivered! +£12,500. Take the ship back out to sea.');
 }
 // camera
 const behind=new THREE.Vector3(Math.sin(heading)*-45,22,Math.cos(heading)*-45);
 camera.position.lerp(new THREE.Vector3(ship.position.x+behind.x,ship.position.y+behind.y,ship.position.z+behind.z),.08);
 camera.lookAt(ship.position.x,ship.position.y+3,ship.position.z+10);
 document.getElementById('speed').textContent=Math.max(0,speed*1.94384).toFixed(1);
 document.getElementById('fuel').textContent=fuel.toFixed(0);
 document.getElementById('cash').textContent=cash.toLocaleString();
 renderer.render(scene,camera);
}
animate(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
